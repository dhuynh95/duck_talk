name: Check the npm token

# Temporary. Answers "why does NPM_TOKEN get a 401" without anyone having to look at
# the token: the runner holds it, and prints only facts about it — how long it is,
# whether it has the npm_ prefix, whether it has whitespace, and what the registry
# says to it raw versus trimmed. GitHub masks the value itself in every log line.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Facts, not the value
        env:
          T: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$T" ]; then echo 'the secret is empty or missing'; exit 1; fi

          trimmed=$(printf %s "$T" | tr -d '[:space:]')
          echo "length            ${#T}   (a classic npm token is 40: npm_ plus 36)"
          echo "length trimmed    ${#trimmed}"
          shape() {
            case "$1" in
              npm_*) echo 'npm_ (classic automation/publish token)' ;;
              npms_*) echo 'npms_ (granular access token)' ;;
              ghp_*|github_pat_*) echo 'a GitHub token, not an npm one' ;;
              *) echo 'neither npm_ nor npms_' ;;
            esac
          }
          echo "prefix, as stored     $(shape "$T")"
          echo "prefix, trimmed       $(shape "$trimmed")"
          echo "lines                 $(printf %s "$T" | wc -l | tr -d ' ') newline(s)"
          # Whether what is there is even token-shaped: a legacy npm token is a UUID.
          case "$trimmed" in
            [0-9a-f]*-[0-9a-f]*-[0-9a-f]*-[0-9a-f]*-[0-9a-f]*) echo 'shape                 looks like a legacy UUID token' ;;
            *) echo 'shape                 not a UUID' ;;
          esac

          ask() {
            curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $1" https://registry.npmjs.org/-/whoami
          }
          echo "registry, as stored   $(ask "$T")"
          echo "registry, whitespace stripped   $(ask "$trimmed")"
          echo
          echo '200 = accepted, 401 = rejected.'
