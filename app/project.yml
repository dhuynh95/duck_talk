name: DuckTalk
options:
  bundleIdPrefix: dev.conception.ducktalk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  DuckTalk:
    type: application
    platform: iOS
    sources:
      - path: DuckTalk
      - path: Shared
    # XcodeGen writes Resources/Info.plist from these on every `./dt gen`,
    # filling in CFBundleIdentifier and friends. Don't hand-edit that file.
    info:
      path: DuckTalk/Resources/Info.plist
      properties:
        CFBundleDisplayName: Duck Talk
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: Duck Talk streams your voice to your Mac so you can talk to it.
        NSCameraUsageDescription: Duck Talk sends a photo you take to Claude, so you can show it what you are looking at.
        # Only for the row of recent pictures behind the plus button — the system picker
        # behind "All photos" needs no permission, so refusing this costs that row alone.
        NSPhotoLibraryUsageDescription: Duck Talk shows your latest photos so you can send one to Claude without leaving the conversation.
        # Typing a LAN address like ws://192.168.1.5:8765 makes iOS ask permission
        # first, and it needs a sentence to show. The Tailscale wss:// address does
        # not go through this, so a phone set up by `./dt phone` never sees it.
        NSLocalNetworkUsageDescription: Duck Talk connects to the relay running on your Mac over your local network.
        # Only ordinary HTTPS, so the annual export self-classification does not
        # apply. Without this key every single upload stops to ask the same question.
        ITSAppUsesNonExemptEncryption: false
        # A conversation does not stop because the screen did. Without this the
        # system suspends the app the moment the phone locks, which kills the mic and
        # the socket together; with it, an app already recording keeps recording.
        # iOS will not let a suspended app *start* recording, so a session still has
        # to be started in the foreground — the listen button — and only then locked.
        # `voip` is what lets a session be a call: callservicesd checks this exact
        # flag before it will register a CXProvider (seen denying in the device log,
        # "hasVoIPBackgroundMode: 0"), and without the provider every CallKit
        # transaction fails as unentitled. The call is how AirPods stem presses
        # reach the app — see Call.swift.
        UIBackgroundModes:
          - audio
          - voip
        # The simulator reaches the relay at ws://localhost:8765, which is cleartext
        # and never leaves the Mac; App Transport Security allows that much only if
        # asked. A real phone gets no such exemption and uses wss:// — see `dt phone`,
        # which puts a Tailscale-issued certificate in front of the same port.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.conception.ducktalk
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        # DuckTalk/Assets.xcassets, generated from the logo by scripts/app-icon.sh —
        # one drawing of the duck, and the icon derived from it. The mark itself lives
        # in Shared/Brand.xcassets, and the call UI draws it too.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The brand orange, as the colour the *system* tints with: a text cursor, a
        # toolbar button, a list checkmark are drawn by iOS, not by us, and this is the
        # only way to reach them. Brand.accent is the same orange for what we draw.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

